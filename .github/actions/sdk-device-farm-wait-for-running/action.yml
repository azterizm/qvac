name: SDK Device Farm - Wait For Running
description: Wait for a scheduled SDK Device Farm run to enter RUNNING before starting the producer.

inputs:
  platform:
    description: "Human-readable platform name for logs (android or ios)."
    required: true
  run-arns-directory:
    description: "Directory containing one .txt file per scheduled Device Farm run ARN."
    required: true
  start-timeout-minutes:
    description: >-
      Maximum minutes to wait for at least one run to enter RUNNING. Pass the
      job's timeout-minutes: the wait gives up a few minutes earlier so it can
      stop the queued runs and report why before GitHub cancels the job.
    required: false
    default: "90"
  poll-interval-seconds:
    description: "Seconds between get-run polling attempts."
    required: false
    default: "15"
  role-to-assume:
    description: >-
      IAM role the job assumed through GitHub OIDC. When set, the wait re-assumes
      it before the 1h OIDC session expires, so a run queued in
      PENDING_CONCURRENCY for longer than an hour stays observable. Requires the
      job's id-token: write permission.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Wait for Device Farm runs
      shell: node {0}
      env:
        PLATFORM: ${{ inputs.platform }}
        RUN_ARNS_DIRECTORY: ${{ inputs.run-arns-directory }}
        START_TIMEOUT_MINUTES: ${{ inputs.start-timeout-minutes }}
        POLL_INTERVAL_SECONDS: ${{ inputs.poll-interval-seconds }}
        ROLE_TO_ASSUME: ${{ inputs.role-to-assume }}
      run: |
        const fs = require('fs');
        const path = require('path');
        const { execFileSync } = require('child_process');

        const pendingStatuses = new Set([
          'PENDING',
          'PENDING_CONCURRENCY',
          'PENDING_DEVICE',
          'PROCESSING',
          'SCHEDULING',
          'PREPARING',
          'UNKNOWN',
        ]);
        const terminalStatuses = new Set([
          'COMPLETED',
          'STOPPED',
          'ERRORED',
          'FAILED',
        ]);

        function parsePositiveInteger(rawValue, fallback, label) {
          const parsed = Number.parseInt(String(rawValue ?? ''), 10);
          if (Number.isFinite(parsed) && parsed > 0) {
            return parsed;
          }
          console.log(`[device-farm-wait] Invalid ${label}=${rawValue}; using ${fallback}`);
          return fallback;
        }

        function sleep(ms) {
          return new Promise((resolve) => setTimeout(resolve, ms));
        }

        function appendSummary(line) {
          if (!process.env.GITHUB_STEP_SUMMARY) {
            return;
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${line}\n`, 'utf8');
        }

        function readRunArns(directory) {
          if (!fs.existsSync(directory)) {
            throw new Error(`Run ARN directory does not exist: ${directory}`);
          }

          const files = fs.readdirSync(directory)
            .filter((fileName) => fileName.endsWith('.txt'))
            .sort();

          const runs = [];
          for (const fileName of files) {
            const filePath = path.join(directory, fileName);
            const arn = fs.readFileSync(filePath, 'utf8').trim();
            if (!arn) {
              console.log(`[device-farm-wait] Ignoring empty ARN file: ${filePath}`);
              continue;
            }
            runs.push({
              name: path.basename(fileName, '.txt'),
              arn,
              status: 'UNKNOWN',
              result: 'UNKNOWN',
              message: '',
              finishedBeforeProducer: false,
            });
          }

          if (runs.length === 0) {
            throw new Error(`No Device Farm run ARN files found in ${directory}`);
          }

          return runs;
        }

        function awsJson(args) {
          const stdout = execFileSync('aws', args, {
            encoding: 'utf8',
            stdio: ['ignore', 'pipe', 'pipe'],
          });
          return JSON.parse(stdout);
        }

        // configure-aws-credentials issues a 1h session for a role assumed through
        // OIDC. Renew it well before then; a failed renewal is retried on the next
        // poll while the current session still has time left.
        const CREDENTIAL_TTL_MS = 60 * 60 * 1000;
        const CREDENTIAL_RENEW_MS = 45 * 60 * 1000;
        const CREDENTIAL_EXPIRY_MARGIN_MS = 2 * 60 * 1000;
        const CREDENTIAL_ENV_KEYS = ['AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY', 'AWS_SESSION_TOKEN'];
        // The job's timeout-minutes equals the start timeout and also covers the
        // steps before this one, so stop this much earlier to keep the timeout path.
        const JOB_TIMEOUT_MARGIN_MS = 3 * 60 * 1000;
        const MAX_POLL_INTERVAL_SECONDS = 300;
        let credentialsIssuedAt = Date.now();
        let credentialsExpireAt = credentialsIssuedAt + CREDENTIAL_TTL_MS;

        async function requestOidcToken() {
          const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if (!requestUrl || !requestToken) {
            throw new Error('ACTIONS_ID_TOKEN_REQUEST_URL is not set; the job needs id-token: write');
          }
          const url = new URL(requestUrl);
          url.searchParams.set('audience', 'sts.amazonaws.com');
          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${requestToken}` },
            signal: AbortSignal.timeout(30 * 1000),
          });
          if (!response.ok) {
            throw new Error(`OIDC token request failed: HTTP ${response.status}`);
          }
          const { value } = await response.json();
          if (!value) {
            throw new Error('OIDC token response has no value');
          }
          console.log(`::add-mask::${value}`);
          return value;
        }

        async function renewCredentials(roleToAssume) {
          const tokenFile = path.join(process.env.RUNNER_TEMP, `device-farm-wait-oidc-${process.pid}`);
          fs.writeFileSync(tokenFile, await requestOidcToken(), { mode: 0o600 });

          // AssumeRoleWithWebIdentity is unsigned; keep the expiring session out of it.
          const env = { ...process.env };
          CREDENTIAL_ENV_KEYS.forEach((key) => delete env[key]);
          let credentials;
          try {
            credentials = JSON.parse(execFileSync('aws', [
              'sts',
              'assume-role-with-web-identity',
              '--role-arn',
              roleToAssume,
              '--role-session-name',
              'GitHubActions',
              '--web-identity-token',
              `file://${tokenFile}`,
              '--duration-seconds',
              '3600',
              '--query',
              'Credentials',
              '--output',
              'json',
            ], { encoding: 'utf8', env, stdio: ['ignore', 'pipe', 'pipe'], timeout: 60 * 1000 }));
          } finally {
            fs.rmSync(tokenFile, { force: true });
          }

          const values = [credentials.AccessKeyId, credentials.SecretAccessKey, credentials.SessionToken];
          if (values.some((value) => !value)) {
            throw new Error('assume-role-with-web-identity returned incomplete credentials');
          }
          values.forEach((value) => console.log(`::add-mask::${value}`));
          CREDENTIAL_ENV_KEYS.forEach((key, index) => {
            process.env[key] = values[index];
          });
          credentialsIssuedAt = Date.now();
          const expiresAt = Date.parse(credentials.Expiration);
          credentialsExpireAt = Number.isFinite(expiresAt) ? expiresAt : credentialsIssuedAt + CREDENTIAL_TTL_MS;
          console.log(`[device-farm-wait] Renewed AWS credentials; expire ${credentials.Expiration}`);
        }

        // Returns false once the session is about to expire and could not be
        // renewed: every later get-run would fail and the wait would go blind.
        async function renewCredentialsIfDue(roleToAssume) {
          if (!roleToAssume || Date.now() - credentialsIssuedAt < CREDENTIAL_RENEW_MS) {
            return true;
          }
          try {
            await renewCredentials(roleToAssume);
          } catch (error) {
            const stderr = error.stderr ? String(error.stderr).trim() : '';
            console.log(
              `[device-farm-wait] AWS credential renewal failed; retrying next poll: ${error.message}${stderr ? ` stderr=${stderr}` : ''}`,
            );
          }
          return Date.now() < credentialsExpireAt - CREDENTIAL_EXPIRY_MARGIN_MS;
        }

        function getRun(run) {
          const response = awsJson([
            'devicefarm',
            'get-run',
            '--arn',
            run.arn,
            '--query',
            'run',
            '--output',
            'json',
          ]);

          return {
            status: response.status ?? 'UNKNOWN',
            result: response.result ?? 'UNKNOWN',
            message: response.message ?? '',
          };
        }

        function stopRun(run, reason) {
          if (terminalStatuses.has(run.status)) {
            console.log(
              `[device-farm-wait] Not stopping ${run.name}; status=${run.status} reason=${reason}`,
            );
            return;
          }

          try {
            console.log(`[device-farm-wait] Stopping ${run.name}: status=${run.status} reason=${reason}`);
            execFileSync('aws', ['devicefarm', 'stop-run', '--arn', run.arn], {
              encoding: 'utf8',
              stdio: ['ignore', 'pipe', 'pipe'],
            });
          } catch (error) {
            const stderr = error.stderr ? String(error.stderr).trim() : '';
            console.log(
              `[device-farm-wait] stop-run failed for ${run.name}: ${error.message}${stderr ? ` stderr=${stderr}` : ''}`,
            );
          }
        }

        function stopActiveRuns(runs, reason) {
          for (const run of runs) {
            stopRun(run, reason);
          }
        }

        function statusSummary(runs) {
          return runs
            .map((run) => `${run.name}:${run.status}${run.result !== 'UNKNOWN' ? `/${run.result}` : ''}`)
            .join(', ');
        }

        async function main() {
          const platform = process.env.PLATFORM || 'mobile';
          const runArnsDirectory = process.env.RUN_ARNS_DIRECTORY || './run-arns';
          const timeoutMinutes = parsePositiveInteger(process.env.START_TIMEOUT_MINUTES, 90, 'START_TIMEOUT_MINUTES');
          // Capped so a long interval cannot skip the credential renewal window.
          const pollIntervalSeconds = Math.min(
            parsePositiveInteger(process.env.POLL_INTERVAL_SECONDS, 15, 'POLL_INTERVAL_SECONDS'),
            MAX_POLL_INTERVAL_SECONDS,
          );
          const timeoutMs = Math.max(timeoutMinutes * 60 * 1000 - JOB_TIMEOUT_MARGIN_MS, 60 * 1000);
          const pollIntervalMs = pollIntervalSeconds * 1000;
          const startedAt = Date.now();
          const roleToAssume = process.env.ROLE_TO_ASSUME || '';
          const runs = readRunArns(runArnsDirectory);

          console.log(`[device-farm-wait] Waiting for ${runs.length} ${platform} Device Farm run(s); producer starts when the first run enters RUNNING`);
          console.log(`[device-farm-wait] timeout=${timeoutMinutes}m pollInterval=${pollIntervalSeconds}s`);
          appendSummary(`### ${platform} Device Farm readiness`);
          appendSummary(`Waiting up to ${timeoutMinutes} minute(s) for at least one of ${runs.length} run(s) to enter \`RUNNING\`.`);

          while (true) {
            if (!(await renewCredentialsIfDue(roleToAssume))) {
              console.log('[device-farm-wait] AWS credentials are about to expire and could not be renewed');
              stopActiveRuns(runs, 'AWS credentials could not be renewed');
              appendSummary('Device Farm readiness failed: AWS credentials could not be renewed during the wait.');
              process.exit(1);
            }
            for (const run of runs) {
              try {
                const latest = getRun(run);
                run.status = latest.status;
                run.result = latest.result;
                run.message = latest.message;
              } catch (error) {
                console.log(`[device-farm-wait] get-run failed for ${run.name}: ${error.message}`);
                run.result = 'UNKNOWN';
                run.message = error.message;
              }
            }

            const elapsedSeconds = Math.round((Date.now() - startedAt) / 1000);
            console.log(`[device-farm-wait] ${elapsedSeconds}s status: ${statusSummary(runs)}`);

            const runningRun = runs.find((run) => run.status === 'RUNNING');
            if (runningRun) {
              console.log(`[device-farm-wait] ${runningRun.name} entered RUNNING after ${elapsedSeconds}s; starting producer`);
              appendSummary(`${runningRun.name} reached \`RUNNING\` after ${elapsedSeconds}s; producer can start.`);
              return;
            }

            for (const run of runs) {
              if (terminalStatuses.has(run.status) && !run.finishedBeforeProducer) {
                const message = run.message ? ` message=${run.message}` : '';
                run.finishedBeforeProducer = true;
                console.log(
                  `[device-farm-wait] ${run.name} reached ${run.status} before producer start; result=${run.result}${message}`,
                );
              }
            }

            const hasPendingRun = runs.some((run) => pendingStatuses.has(run.status));
            if (!hasPendingRun) {
              console.log(
                `[device-farm-wait] All Device Farm runs finished before any RUNNING state was observed: ${statusSummary(runs)}`,
              );
              appendSummary(`Device Farm readiness failed: all runs finished before a \`RUNNING\` state was observed.`);
              process.exit(1);
            }

            const elapsedMs = Date.now() - startedAt;
            if (elapsedMs >= timeoutMs) {
              console.log(
                `[device-farm-wait] Timed out after ${timeoutMinutes}m before any run entered RUNNING: ${statusSummary(runs)}`,
              );
              stopActiveRuns(runs, `did not enter RUNNING within ${timeoutMinutes}m`);
              appendSummary(`Device Farm readiness timed out after ${timeoutMinutes} minute(s): ${statusSummary(runs)}.`);
              process.exit(1);
            }

            await sleep(pollIntervalMs);
          }
        }

        main().catch((error) => {
          console.error(`[device-farm-wait] ${error.stack || error.message}`);
          process.exit(1);
        });
